{% extends 'base.html' %}{% block title %}Preferences — LastBite{% endblock %}{% block content %}<div class="page-heading"><span class="eyebrow">PERSONALISATION</span><h1>Your <span>preferences.</span></h1><p class="muted">Tell LastBite what you like so recommendations can be more relevant.</p></div><div class="panel narrow"><form method="post" class="stack-form"><label>Food categories</label><div class="check-grid">{% for cat in cats %}<label class="check-label"><input type="checkbox" name="categories" value="{{ cat }}" {{ 'checked' if cat in selected }}> {{ cat }}</label>{% endfor %}</div><label>Dietary preferences / restrictions<textarea name="dietary" rows="3" placeholder="Optional. e.g. vegetarian, lactose-free">{{ dietary }}</textarea></label><button class="btn btn-dark">Save preferences</button></form></div>{% endblock %}
