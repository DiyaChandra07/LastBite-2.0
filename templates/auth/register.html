{% extends 'base.html' %}{% block title %}Create account — LastBite{% endblock %}{% block content %}<div class="auth-wrap"><a class="brand" href="/">✳ lastbite<span class="dot">.</span></a><div class="auth-card"><span class="eyebrow">GET STARTED</span><h1>Create your account.</h1><p class="muted">Choose how you'll use LastBite.</p><div class="role-switch"><a class="{{ 'selected' if role=='user' }}" href="{{ url_for('register',role='user') }}">Individual</a><a class="{{ 'selected' if role=='business' }}" href="{{ url_for('register',role='business') }}">Business</a></div><form method="post"><input type="hidden" name="role" value="{{ role }}"><label>Your name / business name</label><input name="name" required placeholder="e.g. Green Basket"><label>Email address</label><input type="email" name="email" required placeholder="you@example.com">{% if role=='business' %}<label>Business type</label><select name="business_type"><option value="restaurant">Restaurant / Café</option><option value="grocery">Grocery / Supermarket</option></select>{% endif %}<label>Password</label><input type="password" name="password" minlength="8" required placeholder="At least 8 characters"><button class="btn btn-dark full">Create {{ role }} account ↗</button></form><p class="auth-foot">Already registered? <a href="{{ url_for('login') }}">Log in</a></p></div></div>{% endblock %}
